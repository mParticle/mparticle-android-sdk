pluginManagement {
    includeBuild('build-logic')

    buildscript {
        repositories {
            mavenCentral()
            maven {
                url = uri("https://storage.googleapis.com/r8-releases/raw")
            }
        }
        dependencies {
            classpath("com.android.tools:r8:8.9.35")
        }
    }
}

include ':android-core',
        ':testutils',
        ':android-kit-base',
        ':kit-plugin',
        ':tooling:custom-lint-rules',
        ':tooling:android-plugin',
        ':tooling:common'


project(':kit-plugin').name = 'android-kit-plugin'
project(':tooling:android-plugin').name = 'android-plugin'

// Size-report fixture. Deliberately NOT in the include list above: `./gradlew test`, `lint`
// and `ktlintCheck` are whole-build sweeps and a throwaway app has no business in any of
// them. Opt in with -Psize.report=true.
if (settings.startParameter.projectProperties['size.report'] == 'true') {
    include ':size-report'
}
