name: "Dependabot Branch Rebase"

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  rebase-branch:
    name: "Rebase Development onto Dependabot Branch"
    uses: mParticle/mparticle-workflows/.github/workflows/dependabot-rebase-development.yml@main
    secrets:
      MP_SEMANTIC_RELEASE_BOT: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
