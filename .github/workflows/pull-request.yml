name: "Build and Test"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  id-token: write

jobs:
  # Code quality checks
  trunk-check:
    name: Trunk code check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          check-mode: pull_request

  instrumented-core:
    uses: ./.github/workflows/instrumented-tests.yml
    with:
      display_name: Core
      gradle_command: ":android-core:cAT -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=none --info --stacktrace"
      artifact_name: instrumented-core-results
      artifact_path: android-core/build/reports/androidTests/connected/**

  instrumented-kit-base:
    uses: ./.github/workflows/instrumented-tests.yml
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    with:
      display_name: "Kit Base Shard ${{ matrix.shard }}/4"
      gradle_command: ":android-kit-base:cAT -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=none -Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}"
      artifact_name: "instrumented-kit-base-results-shard-${{ matrix.shard }}"
      artifact_path: android-kit-base/build/reports/androidTests/connected/**

  instrumented-testutils:
    uses: ./.github/workflows/instrumented-tests.yml
    with:
      display_name: Testutils
      gradle_command: ":testutils:cAT -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=none --info --stacktrace"
      artifact_name: instrumented-testutils-results
      artifact_path: testutils/build/reports/androidTests/connected/**

  instrumented-orchestrator:
    uses: ./.github/workflows/instrumented-tests.yml
    with:
      display_name: Orchestrator
      gradle_command: "-Porchestrator=true :android-core:cAT -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=none --stacktrace"
      artifact_name: instrumented-orchestrator-results
      artifact_path: android-core/build/orchestrator/**
  unit-tests:
    name: "Unit Tests"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: "Run Unit Tests"
        run: ./gradlew test
      - name: "Print Android Unit Tests Report"
        uses: asadmansr/android-test-report-action@384cd31388782f4106dc4a1b37eea2ff02e0aad7 #v1.2.0
        if: always()
      - name: "Archive Unit Test Results"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "unit-tests-results"
          path: ./**/build/reports/**

  lint-checks:
    name: "Lint Checks"
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "ORG_GRADLE_PROJECT_VERSION=$(head -n 1 VERSION)" >> $GITHUB_ENV
      - run: echo "ORG_GRADLE_PROJECT_version=$(head -n 1 VERSION)" >> $GITHUB_ENV
      - name: "Install JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: "Run Android Core SDK Lint"
        run: ./gradlew lint
      - name: "Setup Android Kit Lint"
        run: ./gradlew publishMavenPublicationToMavenLocal
      - name: "Run Android Kit Lint"
        run: ./gradlew -c settings-kits.gradle -Pmparticle.kit.mparticleFromMavenLocalOnly=true lint
      - name: "Archive Lint Test Results"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "lint-results"
          path: ./**/build/reports/**

  kotlin-lint-checks:
    name: "Kotlin Lint Checks"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "ORG_GRADLE_PROJECT_VERSION=$(head -n 1 VERSION)" >> $GITHUB_ENV
      - run: echo "ORG_GRADLE_PROJECT_version=$(head -n 1 VERSION)" >> $GITHUB_ENV
      - name: "Install JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: "Run Android Core SDK Kotlin Lint"
        run: ./gradlew ktlintCheck
      - name: "Setup Android Kit Kotlin Lint"
        run: ./gradlew publishMavenPublicationToMavenLocal
      - name: "Run Android Kit Kotlin Lint"
        run: ./gradlew -c settings-kits.gradle -Pmparticle.kit.mparticleFromMavenLocalOnly=true ktlintCheck
      - name: "Archive Kotlin Lint Test Results"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "kotlin-lint-results"
          path: ./**/build/reports/**

  security-checks:
    name: "Security Lint Checks"
    if: github.event_name == 'pull_request'
    uses: mparticle/mparticle-workflows/.github/workflows/security-checks.yml@main
    with:
      base_branch: main

  build-kits:
    uses: ./.github/workflows/build-kits.yml

  kit-compatibility-test:
    name: "Kit Compatibility Test"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "ORG_GRADLE_PROJECT_VERSION=$(head -n 1 VERSION)" >> $GITHUB_ENV
      - run: echo "ORG_GRADLE_PROJECT_version=$(head -n 1 VERSION)" >> $GITHUB_ENV
      - name: "Install JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: "Generate Core Release Build"
        run: ./gradlew publishMavenPublicationToMavenLocal
      - name: "Run Kit-Base Release Tests and Build"
        run: ./gradlew :android-kit-base:testRelease
      - name: "Run Kit Release Tests and Build"
        run: ./gradlew -p kits testRelease -c ../settings-kits.gradle -Pmparticle.kit.mparticleFromMavenLocalOnly=true
      - name: "Run Isolated Kit Compatibility Tests (urbanairship)"
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/urbanairship/urbanairship-20 -PisRelease=true testRelease
      - name: "Run Isolated Kit Compatibility Tests (braze-43)"
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/braze/braze-43 -PisRelease=true testRelease
      - name: "Run Isolated Kit Compatibility Tests (ga)"
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/ga/ga-23 -PisRelease=true testRelease
      - name: "Run Isolated Kit Compatibility Tests (ga4)"
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/ga4/ga4-23 -PisRelease=true testRelease

  public-api-guard:
    name: "Public API Guard"
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "ORG_GRADLE_PROJECT_VERSION=$(head -n 1 VERSION)" >> "$GITHUB_ENV"
      - run: echo "ORG_GRADLE_PROJECT_version=$(head -n 1 VERSION)" >> "$GITHUB_ENV"
      - name: "Install JDK 17"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # The check runs first. The self-test's clean-tree case fails whenever the
      # branch has a real API diff, so running it first would mask the diff and
      # the explanation behind a confusing self-test failure.
      - name: "Check the public API against the committed baselines"
        id: guard
        run: ./scripts/api-guard.sh check
      - name: "Explain a failure"
        if: failure() && steps.guard.outcome == 'failure'
        run: |
          echo "The public JVM surface of android-core or android-kit-base moved." >&2
          echo "" >&2
          echo "Exit 2 means a frozen contract changed — a class outside" >&2
          echo "com.mparticle.internal, or one listed in" >&2
          echo "scripts/api-guard-frozen-internals.txt. Fix the conversion; do not" >&2
          echo "update the baseline." >&2
          echo "" >&2
          echo "Exit 1 means an internal implementation changed. That is allowed:" >&2
          echo "run 'scripts/api-guard.sh update', commit the baseline in this PR," >&2
          echo "and record the diff and a kit-usage audit in the description." >&2
          echo "" >&2
          echo "See docs/kotlin-migration/PR-GATE.md, item 1." >&2
      - name: "Prove the guard detects breakage"
        if: always()
        run: ./scripts/api-guard-selftest.sh

  kotlin-migration-progress:
    name: "Kotlin Migration Progress"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Measure migration progress"
        id: measure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          read_metric() {
            grep "^$2=" "$1" | cut -d= -f2
          }

          scripts/kotlin-migration-progress.sh --format env >"$RUNNER_TEMP/head.env"
          scripts/kotlin-migration-progress.sh >"$RUNNER_TEMP/head.md"

          # Measure the base branch with the *current* facade list, so that adding
          # or removing a facade entry cannot masquerade as migration progress.
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA" >/dev/null
          mkdir -p "$RUNNER_TEMP/base/scripts"
          cp scripts/kotlin-migration-facades.txt "$RUNNER_TEMP/base/scripts/"
          scripts/kotlin-migration-progress.sh --root "$RUNNER_TEMP/base" --format env >"$RUNNER_TEMP/base.env"

          head_remaining=$(read_metric "$RUNNER_TEMP/head.env" JAVA_REMAINING_LOC)
          head_goal=$(read_metric "$RUNNER_TEMP/head.env" GOAL_PCT)
          base_remaining=$(read_metric "$RUNNER_TEMP/base.env" JAVA_REMAINING_LOC)
          base_goal=$(read_metric "$RUNNER_TEMP/base.env" GOAL_PCT)

          delta_loc=$((head_remaining - base_remaining))
          delta_pct=$(awk -v a="$head_goal" -v b="$base_goal" 'BEGIN { printf "%+.1f", a - b }')

          adds_java=false
          if [ "$delta_loc" -lt 0 ]; then
            headline="This PR migrates **$((-delta_loc)) lines** of Java to Kotlin (${delta_pct} pp)."
          elif [ "$delta_loc" -eq 0 ]; then
            headline="No change to the Java/Kotlin balance in this PR."
          else
            headline=":warning: This PR **adds ${delta_loc} lines** of Java (${delta_pct} pp)."
            adds_java=true
          fi

          {
            echo "<!-- kotlin-migration-progress -->"
            echo "### Kotlin migration progress"
            echo
            echo "$headline"
            echo
            cat "$RUNNER_TEMP/head.md"
          } >"$RUNNER_TEMP/comment.md"

          cat "$RUNNER_TEMP/comment.md" >>"$GITHUB_STEP_SUMMARY"
          echo "delta_loc=$delta_loc" >>"$GITHUB_OUTPUT"
          echo "adds_java=$adds_java" >>"$GITHUB_OUTPUT"
      - name: "Upsert progress comment"
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- kotlin-migration-progress -->"
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          fi
      - name: "Ratchet: no new Java in the migrated modules"
        if: >
          steps.measure.outputs.adds_java == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'allow-new-java')
        env:
          DELTA_LOC: ${{ steps.measure.outputs.delta_loc }}
        run: |
          echo "This PR adds $DELTA_LOC lines of Java to android-core, android-kit-base or" >&2
          echo "the Rokt kit. New code in these modules should be written in Kotlin." >&2
          echo "If the Java is genuinely unavoidable, add the 'allow-new-java' label and" >&2
          echo "say why in the PR description." >&2
          exit 1

  automerge-dependabot:
    name: "Save PR Number for Dependabot Automerge"
    if: github.event_name == 'pull_request'
    needs:
      [
        instrumented-core,
        instrumented-kit-base,
        instrumented-testutils,
        instrumented-orchestrator,
        unit-tests,
        lint-checks,
        kotlin-lint-checks,
        kit-compatibility-test,
        build-kits,
      ]
    uses: mParticle/mparticle-workflows/.github/workflows/dependabot-save-pr-number.yml@main

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    needs:
      - instrumented-core
      - instrumented-kit-base
      - instrumented-testutils
      - instrumented-orchestrator
      - unit-tests
      - lint-checks
      - kotlin-lint-checks
      - security-checks
    name: Notify GChat
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}
