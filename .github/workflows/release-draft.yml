name: Release – Draft

on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7
    inputs:
      bump-type:
        description: |
          How to bump the base version (X.Y.Z). Use `none` to keep the base unchanged
          and only re-qualify an existing pre-release (e.g. rc1 -> rc2).
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      qualifier:
        description: |
          Optional pre-release qualifier to append, without the leading hyphen
          (e.g. `rc1`, `alpha2`, `beta`). Leave blank for a stable release.
          Allowed characters: alphanumerics, dot, hyphen.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-draft-release:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate qualifier input
        env:
          QUALIFIER: ${{ github.event.inputs.qualifier }}
        run: |
          if [ -n "$QUALIFIER" ] && ! [[ "$QUALIFIER" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::qualifier '$QUALIFIER' is invalid. It must start with an alphanumeric character and may only contain alphanumerics, dot, and hyphen."
            exit 1
          fi

      - name: Get current version
        id: version-file
        run: |
          version_from_file=$(head -n 1 VERSION)
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT
          base_version="${version_from_file%%-*}"
          echo "base-version=$base_version" >> $GITHUB_OUTPUT

      - name: Bump base version
        id: bump-version
        if: ${{ github.event.inputs.bump-type != 'none' }}
        uses: actions-ecosystem/action-bump-semver@34e334551143a5301f38c830e44a22273c6ff5c5 # v1.0.0
        with:
          current_version: ${{ steps.version-file.outputs.base-version }}
          level: ${{ github.event.inputs.bump-type }}

      - name: Compose new version
        id: compose-version
        env:
          CURRENT: ${{ steps.version-file.outputs.release-version }}
          BUMPED: ${{ steps.bump-version.outputs.new_version }}
          BASE: ${{ steps.version-file.outputs.base-version }}
          BUMP_TYPE: ${{ github.event.inputs.bump-type }}
          QUALIFIER: ${{ github.event.inputs.qualifier }}
        run: |
          if [ "$BUMP_TYPE" = "none" ]; then
            new_base="$BASE"
          else
            new_base="$BUMPED"
          fi

          if [ -n "$QUALIFIER" ]; then
            new_version="${new_base}-${QUALIFIER}"
          else
            new_version="$new_base"
          fi

          if [ "$new_version" = "$CURRENT" ]; then
            echo "::error::Computed version '$new_version' is identical to the current VERSION. Pick a different bump-type or qualifier."
            exit 1
          fi

          echo "new-version=$new_version" >> $GITHUB_OUTPUT

      - name: Save bumped version to file
        run: |
          echo "${{ steps.compose-version.outputs.new-version }}" > VERSION

      - name: Publish core to Maven local (smoke test)
        run: ./gradlew publishMavenPublicationToMavenLocal -PVERSION=${{ steps.compose-version.outputs.new-version }} --no-build-cache

      - name: Publish aggregate kits to Maven local (smoke test)
        run: ./gradlew publishMavenPublicationToMavenLocal -PVERSION=${{ steps.compose-version.outputs.new-version }} -c settings-kits.gradle --no-build-cache

      - name: Publish isolated kit to Maven local (urbanairship-20 smoke test)
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/urbanairship/urbanairship-20 -PVERSION=${{ steps.compose-version.outputs.new-version }} publishMavenPublicationToMavenLocal --no-build-cache

      - name: Publish isolated kit to Maven local (braze-43 smoke test)
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/braze/braze-43 -PVERSION=${{ steps.compose-version.outputs.new-version }} publishMavenPublicationToMavenLocal --no-build-cache

      - name: Publish isolated kit to Maven local (ga-23 smoke test)
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/ga/ga-23 -PVERSION=${{ steps.compose-version.outputs.new-version }} publishMavenPublicationToMavenLocal --no-build-cache

      - name: Publish isolated kit to Maven local (ga4-23 smoke test)
        run: ./gradlew -Pmparticle.kit.mparticleFromMavenLocalOnly=true -p kits/ga4/ga4-23 -PVERSION=${{ steps.compose-version.outputs.new-version }} publishMavenPublicationToMavenLocal --no-build-cache

      - name: Generate changelog entry
        id: changelog
        # Pinned SHA for Semgrep (no mutable @main); bump when upgrading the action.
        uses: ROKT/rokt-workflows/actions/generate-changelog@c5c93e92107c520fb8b8cf71070995abdf4c403f
        with:
          version: ${{ steps.compose-version.outputs.new-version }}
          repo-url: https://github.com/${{ github.repository }}
          changelog-path: CHANGELOG.md
          exclude-types: chore,ci,test,build
          kits-path: kits

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.MP_SEMANTIC_RELEASE_BOT }}
          commit-message: "chore: prepare release ${{ steps.compose-version.outputs.new-version }}"
          branch: release-prep/${{ steps.compose-version.outputs.new-version }}
          title: "chore: prepare release ${{ steps.compose-version.outputs.new-version }}"
          base: ${{ github.ref_name }}
          body: |
            ## Release ${{ steps.compose-version.outputs.new-version }}

            ### Release details

            - Version: `${{ steps.compose-version.outputs.new-version }}`
            - Bump type: `${{ github.event.inputs.bump-type }}`
            - Base branch: `${{ github.ref_name }}`

            ### Files updated

            - `VERSION` set to `${{ steps.compose-version.outputs.new-version }}`
            - `CHANGELOG.md` updated with the generated release notes

            ### Validation

            The Release – Draft workflow successfully smoke-tested Maven local publication for the core SDK, aggregate kits, and isolated kits before opening this PR.

            ## Changelog

            ${{ steps.changelog.outputs.release-notes }}

            ---

            **On merge:** The [Release – Publish](https://github.com/${{ github.repository }}/actions/workflows/release-publish.yml) workflow will publish the core SDK, aggregate and isolated kits, and `rokt-sdk-plus` to Maven Central, tag the release, and create the GitHub release.
