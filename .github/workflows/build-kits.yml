name: Build Kits

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-matrix:
    name: Load kit matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: kits/matrix.json
          sparse-checkout-cone-mode: false
      - id: set
        run: echo "matrix=$(jq -c . kits/matrix.json)" >> "$GITHUB_OUTPUT"

  # Builds the core SDK once and shares the resulting Maven Local repository with
  # every build-kits matrix job, instead of each of them rebuilding it.
  publish-core:
    name: Publish core SDK to Maven Local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set SDK version
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION=$(head -n 1 VERSION)" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_version=$(head -n 1 VERSION)" >> "$GITHUB_ENV"

      - name: Install JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: zulu
          java-version: "17"

      # Writable, unlike build-kits below: one job, so one cache entry per run.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Publish core SDK to Maven Local
        run: ./gradlew publishMavenPublicationToMavenLocal

      - name: Archive Maven Local repository
        run: tar -czf maven-local.tar.gz -C "$HOME/.m2" repository

      - name: Upload Maven Local repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-local-core
          path: maven-local.tar.gz
          retention-days: 1
          compression-level: 0

  build-kits:
    name: Build ${{ matrix.kit.name }}
    needs: [load-matrix, publish-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set SDK version
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION=$(head -n 1 VERSION)" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_version=$(head -n 1 VERSION)" >> "$GITHUB_ENV"

      - name: Install JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true

      - name: Download Maven Local repository
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: maven-local-core

      - name: Restore core SDK into Maven Local
        run: |
          mkdir -p "$HOME/.m2"
          tar -xzf maven-local.tar.gz -C "$HOME/.m2"
          rm maven-local.tar.gz

      - name: Run kit unit tests
        if: ${{ matrix.kit.skip_unit_tests != true }}
        run: |
          ./gradlew "${{ matrix.kit.kit_project }}:testRelease" \
            -c settings-kits.gradle \
            -Pmparticle.kit.mparticleFromMavenLocalOnly=true

      - name: Build Kotlin example
        if: ${{ matrix.kit.skip_example_builds != true && matrix.kit.example_kotlin_project != '' }}
        run: |
          ./gradlew "${{ matrix.kit.example_kotlin_project }}:assembleDebug" \
            -c settings-kit-examples.gradle \
            -Pmparticle.kit.mparticleFromMavenLocalOnly=true

      - name: Build Java example
        if: ${{ matrix.kit.skip_example_builds != true && matrix.kit.example_java_project != '' }}
        run: |
          ./gradlew "${{ matrix.kit.example_java_project }}:assembleDebug" \
            -c settings-kit-examples.gradle \
            -Pmparticle.kit.mparticleFromMavenLocalOnly=true
